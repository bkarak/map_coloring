name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test
        run: make CC=${{ matrix.cc }} test

  sanitizers:
    name: address + undefined
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: >
          make CC=clang
          OPT="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          LDFLAGS="-fsanitize=address,undefined"
      - name: Test
        # Leak checking is off on purpose. The program allocates a copy of every
        # independent set it finds and frees none of them: it is a run-once
        # command that exits when it has printed an answer. Turning that into a
        # clean teardown would be a change to the 2002 algorithm code, not to
        # the build, so it is not something CI should be failing over.
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make test
